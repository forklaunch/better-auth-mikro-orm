name: CI

on:
  push:
    branches: [main]
    paths:
      - "**.ts"
      - "*.config.ts"
      - "tsconfig.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/ci.yaml"
  pull_request:
    branches: [main]
    paths:
      - "**.ts"
      - "*.config.ts"
      - "tsconfig.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/ci.yaml"

jobs:
  ci:
    strategy:
      matrix:
        os: [ubuntu-24.04]
        node: [20.x, 22.x, 24.x, 25.x]
    runs-on: ${{matrix.os}}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: adapter-test-only
          POSTGRES_DB: adapter_consume_regression
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ADAPTER_TEST_POSTGRES_URL: postgresql://postgres:adapter-test-only@127.0.0.1:5432/adapter_consume_regression

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{matrix.node}}

      - name: Setup pnpm
        id: pnpm-install
        uses: pnpm/action-setup@v6.0.8
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v5
        name: Setup pnpm cache
        with:
          path: ${{env.STORE_PATH}}
          key: ${{runner.os}}-pnpm-store-${{hashFiles('**/pnpm-lock.yaml')}}
          restore-keys: |
            ${{runner.os}}-pnpm-store-
      
      - name: Install dependencies
        run: pnpm i --frozen-lockfile --prefer-offline

      - name: Run tests
        run: pnpm coverage

      - name: Upload coverage report
        if: matrix.node == '22.x'
        uses: codecov/codecov-action@v6
        with:
          token: ${{secrets.CODECOV_TOKEN}}
